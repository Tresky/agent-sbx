# Shared defaults. NO SECRET belongs in this file. The host scripts source it;
# the Mac CLI parses it as KEY=VALUE lines. To change a value, write it to
# host/local.conf in this repository: the host scripts and the Mac CLI both read
# that file on top of this one, so the two sides always agree. Keep every value
# a plain literal: the Python side does not expand variables.

# DNS zone that dnsmasq owns. A VM named sbx-myapp answers at
# sbx-myapp.$SBX_DOMAIN. Never a .local name: macOS sends .local to mDNS.
SBX_DOMAIN=sbx.internal

# The bridge that carries your LAN, and the two sandbox bridges. The sandbox
# bridges have no physical port and the host holds no address on them, so a
# sandbox cannot reach the hypervisor. Profile membership is the bridge a NIC
# sits on, because a root user inside a VM cannot change that.
SBX_LAN_BRIDGE=vmbr0
SBX_AGENT_BRIDGE=vmbr77
SBX_PERSONAL_BRIDGE=vmbr78

# First three octets of each /24. The gateway holds .1, DHCP serves .50-.250.
SBX_AGENT_NET=10.77.0
SBX_PERSONAL_NET=10.78.0

# The gateway container.
SBX_GW_CTID=9001
SBX_GW_HOSTNAME=sbx-gw
# The gateway's address on your LAN. "dhcp", or a static "192.168.1.2/24" with
# SBX_GW_LAN_GW set to the router of that subnet. Use a static address when
# the LAN subnet of the host has no DHCP server.
SBX_GW_LAN_IP=dhcp
SBX_GW_LAN_GW=
SBX_GW_STORAGE=local-lvm
SBX_GW_TEMPLATE_STORAGE=local
SBX_UPSTREAM_DNS="1.1.1.1 9.9.9.9"
SBX_DHCP_LEASE=1h
SBX_TAILSCALE_TAG=tag:sbx-gw

# The base VM template and the id range that sandboxes take.
SBX_TEMPLATE_VMID=9000
SBX_VM_STORAGE=local-lvm
SBX_SNIPPET_STORAGE=local
SBX_IMAGE_STORAGE_DIR=/var/lib/vz/template/iso
# The pool that holds every sandbox. The API token is scoped to it.
SBX_POOL=sbx
# Name of a PCI Resource Mapping for the GPU (Datacenter > Resource Mappings).
# Empty = the token gets no GPU permission.
SBX_GPU_MAPPING=
SBX_VMID_MIN=9100
SBX_VMID_MAX=9199
SBX_VM_USER=dev

# Template build size. A clone can be resized by the CLI.
SBX_TEMPLATE_CORES=8
SBX_TEMPLATE_MEMORY_MB=8192
SBX_TEMPLATE_DISK_GB=60

# Toolchains baked into the template. Space-separated lists.
SBX_UBUNTU_IMAGE_URL=https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
# The template CACHES these; a project always gets its own versions through
# rvm, nvm and go.mod at recipe time. `sbx versions --write` derives the lists
# from the registered projects into host/local.conf, which overrides this
# file. Rubies: FULL versions only, because rvm stable's database ends in
# 2021 and cannot complete a partial "3.4". The first Ruby and Node in each
# list become the template's defaults.
SBX_RUBY_VERSIONS="3.4.10"
SBX_NODE_VERSIONS="lts/*"
# Docker images the projects' compose files name, pulled into the template.
SBX_DOCKER_IMAGES=""
# Go: the official tarball, at /usr/local/go. A full version, from https://go.dev/dl/
# Empty = no Go in the template.
SBX_GO_VERSION=1.27.1

# Optional parts of the template, from template/extras/<name>.sh. A
# space-separated list, for example "odin gis". Empty = the core only.
#   odin   the Odin compiler, wgpu-native, premake, SDL2 and Lua headers
#   gis    GEOS, GDAL and PROJ, for PostGIS and RGeo
SBX_TEMPLATE_EXTRAS=""
# More apt packages for the template, space-separated.
SBX_EXTRA_APT_PACKAGES=""
# The versions that the odin extra installs.
SBX_ODIN_VERSION=dev-2025-11
SBX_WGPU_VERSION=v27.0.2.0
SBX_PREMAKE_VERSION=5.0.0-beta8
