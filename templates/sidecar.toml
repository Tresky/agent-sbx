# The sidecar of an agent sandbox: a bare VM with nftables and the sidecar
# service, and none of the core. `sbx new` clones one beside each agent
# sandbox; host/defaults.conf names this definition in SBX_SIDECAR_TEMPLATE.
#
# Debian's genericcloud image: a cloud kernel, no hardware drivers or
# firmware. The sandboxes stay on Ubuntu.
description = "the sidecar of an agent sandbox: firewall, credential proxy, port policy"
bare        = true
components  = ["sidecar"]
image_url   = "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
cores       = 1
memory_mb   = 512
disk_gb     = 4
